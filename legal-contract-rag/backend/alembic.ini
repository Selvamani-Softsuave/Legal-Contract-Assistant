[alembic]
script_location = backend/alembic
prepend_sys_path = .

[logging]
default_handler = stream

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = stream

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = stream

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_stream]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
