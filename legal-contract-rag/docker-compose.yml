version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: legal_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=LegalRAG_Password2026!
    ports:
      - "1433:1433"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: legal_azurite
    ports:
      - "10000:10000" # Blob
      - "10001:10001" # Queue
      - "10002:10002" # Table
    volumes:
      - azurite_data:/data

  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: legal_chromadb
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      - chroma_data:/chroma/chroma

  ollama:
    image: ollama/ollama:latest
    container_name: legal_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  processor:
    build:
      context: .
      dockerfile: processor/Dockerfile
    container_name: legal_processor
    ports:
      - "7071:7071"
    environment:
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;
      - FUNCTIONS_WORKER_RUNTIME=python
      - AzureWebJobsFeatureFlags=EnableWorkerIndexing
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;
      - QUEUE_NAME=legal-document-processing
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - COLLECTION_NAME=legal_contracts
      - DATABASE_URL=mssql+pyodbc://sa:LegalRAG_Password2026!@sqlserver:1433/LegalContractRAG?driver=ODBC+Driver+17+for+SQL+Server
      - OLLAMA_BASE_URL=http://ollama:11434
      - BACKEND_API_URL=http://backend:8080
      - AI_PROVIDER=${AI_PROVIDER:-OLLAMA}
      - AI_API_KEY=${AI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
    depends_on:
      - azurite
      - chromadb
      - sqlserver

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: legal_backend
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=mssql+pyodbc://sa:LegalRAG_Password2026!@sqlserver:1433/LegalContractRAG?driver=ODBC+Driver+17+for+SQL+Server
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;
      - DOCUMENT_PROCESSOR_URL=http://processor:7071
      - OLLAMA_BASE_URL=http://ollama:11434
      - AI_PROVIDER=${AI_PROVIDER:-OLLAMA}
      - AI_API_KEY=${AI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
    depends_on:
      - sqlserver
      - azurite
      - processor

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: legal_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  azurite_data:
  chroma_data:
  ollama_data:
